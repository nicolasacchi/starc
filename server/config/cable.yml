# ActionCable pub/sub adapter.
#
# development / test : the in-process async adapter, so the repo runs with no
#                      external service.
# production         : the async adapter by default, because the container
#                      ships with no Redis. Setting REDIS_URL switches to
#                      Redis, so scaling the app out stays a config flip —
#                      every process then sees the same `lobby` and
#                      `game:<id>` streams.
development:
  adapter: async

test:
  adapter: async

production:
  adapter: <%= ENV["REDIS_URL"].to_s.empty? ? "async" : "redis" %>
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: starc_production
