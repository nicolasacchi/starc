# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3
  # Write-Ahead Logging plus a real busy timeout. Without WAL a second process
  # — a parallel rspec run, or the e2e server, which is a separate process
  # against this same file — fails outright with "database is locked" rather
  # than waiting. WAL lets readers run alongside the writer, and busy_timeout
  # makes a competing writer wait its turn instead of erroring.
  pragmas:
    journal_mode: wal
    synchronous: normal
    busy_timeout: 15000

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
production:
  <<: *default
  database: storage/production.sqlite3
  # Same reasoning as test:, and it matters more here: the match runner writes
  # every simulation tick while REST reads and the cable's snapshot broadcast
  # read the same file, and a one-off `runner`/`console` is a second writer.
  # Without WAL a reader cannot overlap the writer at all and the server fails
  # outright with "database is locked" instead of waiting its turn.
  pragmas:
    journal_mode: wal
    synchronous: normal
    busy_timeout: 15000
